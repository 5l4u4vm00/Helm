name: Update Homebrew Cask

# Bumps version + sha256 in YIHSUAN603/homebrew-tap's Casks/helm-terminal.rb
# whenever a release is published (draft -> published).
#
# Deliberately NOT triggered by the v* tag push that runs release.yml: that
# workflow creates a *draft* release, and asset URLs under a draft 404 for
# everyone except the repo owner, so a cask bumped at tag time would point at
# downloads nobody can fetch until the release is published by hand.
#
# The workflow_dispatch input doubles as the bootstrap: the step below writes
# the whole cask file, so running it once against an existing tag creates
# Casks/helm-terminal.rb from nothing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v0.15.6)'
        required: true
        type: string

# Nothing here touches the Helm repo; the tap is written with a PAT.
permissions: {}

jobs:
  update-cask:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN is scoped to this repository only, so a cross-repo push
      # needs a PAT: TAP_GITHUB_TOKEN has contents:write on homebrew-tap.
      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          repository: YIHSUAN603/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Regenerate Casks/helm-terminal.rb
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/YIHSUAN603/Helm/releases/download/${TAG}"

          # VERSION is interpolated into an unquoted heredoc below, so pin its
          # shape rather than trusting the tag: git allows '$' and backticks in
          # refnames, which would otherwise be expanded into the cask.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1
          fi

          # Download to files rather than piping curl into shasum: under
          # GitHub's default `bash -e` (no pipefail) a failed download feeds
          # shasum an empty stream and yields the sha256 of "" (e3b0c442...),
          # silently publishing a cask that fails verification for everyone.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/arm.dmg"   "${BASE}/Helm_${VERSION}_aarch64.dmg"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/intel.dmg" "${BASE}/Helm_${VERSION}_x64.dmg"
          ARM_SHA=$(shasum -a 256 "$RUNNER_TEMP/arm.dmg" | cut -d' ' -f1)
          INTEL_SHA=$(shasum -a 256 "$RUNNER_TEMP/intel.dmg" | cut -d' ' -f1)
          rm -f "$RUNNER_TEMP/arm.dmg" "$RUNNER_TEMP/intel.dmg"

          for sha in "$ARM_SHA" "$INTEL_SHA"; do
            if [ "${#sha}" -ne 64 ]; then
              echo "::error::unexpected sha256 '$sha'"; exit 1
            fi
          done

          # Unquoted heredoc: ${VERSION}/${ARM_SHA}/${INTEL_SHA} expand, while
          # Ruby's #{version} / #{arch} / #{appdir} pass through untouched.
          # Keep '$' and backticks out of the cask body.
          cat > Casks/helm-terminal.rb <<EOF
          # Generated by YIHSUAN603/Helm .github/workflows/update-homebrew-cask.yml.
          # Edit the template there, not this file - the next release overwrites it.
          cask "helm-terminal" do
            arch arm: "aarch64", intel: "x64"

            version "${VERSION}"
            sha256 arm:   "${ARM_SHA}",
                   intel: "${INTEL_SHA}"

            url "https://github.com/YIHSUAN603/Helm/releases/download/v#{version}/Helm_#{version}_#{arch}.dmg"
            name "Helm"
            desc "Terminal that watches your AI coding agents"
            homepage "https://github.com/YIHSUAN603/Helm"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true
            depends_on macos: :catalina

            app "Helm.app"

            # Ad-hoc signed, not notarized: clear the quarantine flag Homebrew
            # sets, or macOS reports the app as damaged. Homebrew 6 removed the
            # --no-quarantine flag, so the cask has to do it.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/Helm.app"]
            end

            zap trash: [
              "~/Library/Application Support/com.arieschao.helm",
              "~/Library/Caches/com.arieschao.helm",
              "~/Library/HTTPStorages/com.arieschao.helm",
              "~/Library/Preferences/com.arieschao.helm.plist",
              "~/Library/Saved Application State/com.arieschao.helm.savedState",
              "~/Library/WebKit/com.arieschao.helm",
            ]
          end
          EOF

      - name: Commit and push
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/helm-terminal.rb
          if git diff --staged --quiet; then
            echo "cask unchanged, nothing to push"
            exit 0
          fi
          git commit -m "chore: update helm-terminal cask to ${TAG#v}"
          git push
